[package]
name = "ocio-py-ffi"
description = "The CPython calls of PyOpenColorIO-rs that need `unsafe`: the Python binding's only unsafe code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# Off by default, as ocio-py's `python` feature, so that building the workspace needs no Python.
python = ["dep:pyo3"]

[dependencies]
pyo3 = { workspace = true, optional = true }

[lints]
workspace = true
