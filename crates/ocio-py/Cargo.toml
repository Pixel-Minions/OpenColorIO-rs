[package]
name = "ocio-py"
description = "PyOpenColorIO-compatible Python module backed by the Rust port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "ocio_py"
# cdylib: the extension module `cargo xtask py-build` lays out as PyOpenColorIO; rlib: the
# embedding API for Rust applications (6.1c).
crate-type = ["cdylib", "rlib"]

[features]
# The bindings. Off by default, so that building the workspace needs no Python: PyO3's build
# finds the interpreter (PYO3_PYTHON), which `cargo xtask py-build` points at target/py-port.
python = ["dep:pyo3", "dep:numpy", "ocio-py-ffi/python"]
# The module as Python imports it (`cargo xtask py-build`): no link to libpython on Linux.
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
ocio.workspace = true
ocio-ops.workspace = true
ocio-gpu.workspace = true
ocio-py-ffi.workspace = true
pyo3 = { workspace = true, optional = true }
numpy = { workspace = true, optional = true }
half.workspace = true

[dev-dependencies]
ocio-testkit.workspace = true
serde_json.workspace = true

[lints]
workspace = true
