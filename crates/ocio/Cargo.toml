[package]
name = "opencolorio-rs"
description = "OpenColorIO 2.5.2, ported to Rust: configs, transforms, processors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The ports of yaml-cpp (MIT) and minizip-ng (Zlib), THIRD-PARTY-NOTICES.md. The SampleICC part is
# under the ICC Software License 0.2, which has no SPDX identifier; README.md names it.
license = "BSD-3-Clause AND MIT AND Zlib"
authors.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Tests read the repository (fixtures, upstream/, the oracle) and stay out of the package.
exclude = [
    "/tests/",
    "*_tests.rs",
    "/src/file_tests/",
    "/src/test_env.rs",
    "/src/fileformats/test_utils.rs",
    "/src/yaml_cpp/handler_test.rs",
    "/src/yaml_cpp/spec_examples.rs",
    "/src/apphelpers/configs_data.rs",
]

[lib]
# Published as this package's name; in code it stays `ocio`.
name = "ocio"

[dependencies]
ocio-ops.workspace = true
ocio-formats.workspace = true
flate2.workspace = true
ocio-gpu.workspace = true

[dev-dependencies]
ocio-testkit.workspace = true
serde_json.workspace = true
xxhash-rust.workspace = true

[lints]
workspace = true
