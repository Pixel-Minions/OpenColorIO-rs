[package]
name = "opencolorio-rs-ops"
description = "OpenColorIO ops: op data, CPU renderers (numeric profiles), optimizer, pixel formats, CPUInfo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Tests read the repository (fixtures, upstream/, the oracle) and stay out of the package.
exclude = [
    "/tests/",
    "*_tests.rs",
    "/src/unit_test_log_utils.rs",
]

[lib]
# Published as this package's name; in code it stays `ocio_ops`.
name = "ocio_ops"

[dependencies]
half.workspace = true
xxhash-rust.workspace = true
zerocopy.workspace = true

[dev-dependencies]
ocio-testkit.workspace = true
serde_json.workspace = true

[lints]
workspace = true
