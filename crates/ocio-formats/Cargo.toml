[package]
name = "opencolorio-rs-formats"
description = "OpenColorIO LUT and transform file readers and writers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The port of expat (THIRD-PARTY-NOTICES.md).
license = "BSD-3-Clause AND MIT"
authors.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Tests read the repository (fixtures, upstream/, the oracle) and stay out of the package.
exclude = [
    "/tests/",
    "*_tests.rs",
]

[lib]
# Published as this package's name; in code it stays `ocio_formats`.
name = "ocio_formats"

[dependencies]
ocio-ops.workspace = true

[dev-dependencies]
ocio-testkit.workspace = true

[lints]
workspace = true
