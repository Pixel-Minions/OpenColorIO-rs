# Diagnostic only: NEVER MERGE. Native prebuild plus complete original legacy40-request case; not full SDE coverage.
name: P49 SDE runtime budget
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
  OCIO_RS_ORACLE_NO_CACHE: "1"
  OCIO_RS_TIER: quick
jobs:
  budget:
    name: P49 budget (${{ matrix.os }}, nhm)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-2025, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Immutable source, no test changes
        run: |
          mkdir -p kept/p49-budget
          git fetch --depth=1 origin 1935c17e5fa197498ea58a570cfa8ba49a7ce4d9
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse FETCH_HEAD > kept/p49-budget/source-commit.txt
          git rev-parse HEAD > kept/p49-budget/validation-commit.txt
          git fetch --depth=1 origin be369c75000cefebfc8faf992b553add930ff6ae
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sde
      - uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-${{ runner.os }}
      - name: Windows native prebuild and complete legacy case
        if: runner.os == 'Windows'
        run: |
          set -e -o pipefail
          {
            cargo fmt --all --check
            cargo xtask ci --base be369c75000cefebfc8faf992b553add930ff6ae
            cargo xtask oracle info
            python scripts/sde_native_warmup.py | tee kept/p49-budget/warmup-before.json
            cargo cpu-tests --release --no-run
            scripts/sde.sh nhm python scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- legacy_large_lattice_values_match_native_wheel --exact
            python scripts/sde_native_warmup.py | tee kept/p49-budget/warmup-after.json
          } 2>&1 | tee kept/p49-budget/budget.log
      - name: Rocky reference image
        if: runner.os == 'Linux'
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Allow SDE tracing
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Rocky native prebuild and complete legacy case
        if: runner.os == 'Linux'
        run: |
          set -e -o pipefail
          scripts/rocky9.sh bash -ec '
            export OCIO_RS_TIER=quick CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1
            git config --global --add safe.directory "*"
            cargo fmt --all --check
            cargo xtask ci --base be369c75000cefebfc8faf992b553add930ff6ae
            cargo xtask oracle info
            python3 scripts/sde_native_warmup.py | tee kept/p49-budget/warmup-before.json
            cargo cpu-tests --release --no-run
            scripts/sde.sh nhm python3 scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- legacy_large_lattice_values_match_native_wheel --exact
            python3 scripts/sde_native_warmup.py | tee kept/p49-budget/warmup-after.json
          ' 2>&1 | tee kept/p49-budget/budget.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p49-${{ runner.os }}-nhm
          path: |
            kept/p49-budget/
            kept/sde-cpu-tests/
          retention-days: 30
