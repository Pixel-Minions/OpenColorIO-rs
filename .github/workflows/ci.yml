# Temporary validation branch only. Never merge this workflow into main.
name: GPU class candidate validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
  OCIO_RS_ORACLE_NO_CACHE: "1"
jobs:
  gpu-class:
    name: GPU class (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Pin the exact implementation source
        run: |
          mkdir -p kept/ci-validation
          git fetch --depth=1 origin refs/heads/codex/p19-gpu-suite1
          source=$(git rev-parse FETCH_HEAD)
          git diff --exit-code "$source" HEAD -- . ':(exclude).github/workflows/ci.yml'
          printf '%s\n' "$source" > kept/ci-validation/source-commit.txt
          git rev-parse HEAD > kept/ci-validation/validation-commit.txt
          git fetch --depth=1 origin a34cb567d31f0e733037cea79340baffff7e0822
          git fetch --depth=1 origin d423697b720179ae14e3cc691d429db4ba2aec6d
          python3 - <<'PY'
          import pathlib, subprocess, tomllib
          active = pathlib.Path("waivers.toml").read_text()
          rows = tomllib.loads(active)["waiver"]
          assert [r["id"] for r in rows] == ["W0001", "W0002", "W0013"]
          assert all("gpu_renderer" not in r for r in rows)
          previous = subprocess.check_output(["git", "show", "d423697b720179ae14e3cc691d429db4ba2aec6d:waivers.toml"]).decode()
          start = previous.index('[[waiver]]\nid = "W0003"')
          end = previous.index('# Owner-approved 2026-10-29.')
          archived = pathlib.Path("docs/archive/gpu-matrix-waivers-2026-10-27.toml").read_text()
          assert archived.endswith(previous[start:end].rstrip() + "\n")
          assert active.startswith(previous[:start])
          PY
      - name: Build the unchanged reference image
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Guardrails and GPU clippy
        run: |
          set -o pipefail
          scripts/rocky9.sh bash -ec '
            export CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1 LP_NUM_THREADS=1
            git config --global --add safe.directory "*"
            cargo fmt --all --check
            cargo xtask ci --base a34cb567d31f0e733037cea79340baffff7e0822
            cargo xtask parity
            cargo xtask ratchet --update
            cargo xtask ci --main --base a34cb567d31f0e733037cea79340baffff7e0822
            mkdir -p kept/ci-validation/generated
            cp docs/parity.md docs/ratchet.toml kept/ci-validation/generated/
            cargo clippy --keep-going --locked -j2 -p ocio-gpu-exec --all-targets -- -D warnings
          ' 2>&1 | tee kept/ci-validation/guardrails.log
      - name: Native regression, rejection controls and all 69 original GPU cases
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          flag=""
          if [ "$PROFILE" = release ]; then flag="--release"; fi
          scripts/rocky9.sh bash -ec "
            export CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1 LP_NUM_THREADS=1
            git config --global --add safe.directory '*'
            cargo test --locked -j2 -p ocio-testkit $flag gpu_waivers -- --test-threads=1 --show-output
            cargo test --no-fail-fast --locked -j2 -p ocio-gpu-exec $flag --lib --tests -- --test-threads=1 --show-output
          " 2>&1 | tee kept/ci-validation/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-class-candidate-${{ matrix.profile }}
          path: kept/
          retention-days: 30
