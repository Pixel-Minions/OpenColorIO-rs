name: CI

on:
  push:
    branches: [main, "ocio-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Both reference platforms (PLAN.md D11) run the live oracle: pixel checks compare the port
  # with the opencolorio==2.5.2 wheel on the same machine. The oracle test battery runs its
  # full tier here (OCIO_RS_TIER, ocio_testkit::battery::Tier); quick is the local default.
  windows:
    name: Windows x86-64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - name: Guardrails, fixtures, ratchet, parity
        run: cargo xtask ci
      - run: cargo test --workspace --no-fail-fast
        env:
          OCIO_RS_TIER: full
      - name: Tests in release (optimization must not change any bit)
        run: cargo test --workspace --release --no-fail-fast
        env:
          OCIO_RS_TIER: full
      - name: Committed fixtures are identical on this platform
        run: cargo xtask oracle check-all

  rocky9:
    name: Linux x86-64 (Rocky Linux 9)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Build the reference image
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: fmt, clippy, guardrails, tests, fixtures
        run: |
          scripts/rocky9.sh bash -ec '
            git config --global --add safe.directory "*"
            cargo fmt --all --check
            cargo clippy --workspace --all-targets
            cargo xtask ci
            export OCIO_RS_TIER=full
            cargo test --workspace --no-fail-fast
            cargo test --workspace --release --no-fail-fast
            cargo xtask oracle check-all
          '

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
