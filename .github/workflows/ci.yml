# Diagnostic only. NEVER MERGE.
name: SDE fresh-process library trial
on:
  workflow_dispatch:
  push:
    branches: [codex/sde-fresh-process-trial]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  OCIO_RS_ORACLE_NO_CACHE: "1"
  OCIO_RS_TIER: quick
jobs:
  trace:
    name: Fresh-process SDE (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Exact source
        run: |
          mkdir -p kept/sde-fresh-process-trial
          git rev-parse HEAD > kept/sde-fresh-process-trial/validation-commit.txt
          git fetch --depth=1 origin 1e4781c5b103617a3dfc258f86e38b3a81435e15
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse FETCH_HEAD > kept/sde-fresh-process-trial/source-commit.txt
          git fetch --depth=1 origin 2f768f6fb69cc53e040f8c3d1d2ea0df1d6dfc0c
          git diff --exit-code 2f768f6fb69cc53e040f8c3d1d2ea0df1d6dfc0c HEAD -- crates oracle .cargo scripts/sde.sh .github/workflows/sde.yml
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sde
      - uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
      - name: Windows native build and actual HSW workload
        if: runner.os == 'Windows'
        run: |
          rustup show active-toolchain
          cargo xtask oracle info
          cargo test --locked --release -p ocio --lib --no-run --message-format=json > kept/sde-fresh-process-trial/compiler-artifacts.jsonl
          scripts/sde.sh hsw python scripts/diagnostics/sde_fresh_process_trial.py
      - name: Rocky image
        if: runner.os == 'Linux'
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Rocky native build and actual SNB workload
        if: runner.os == 'Linux'
        run: |
          scripts/rocky9.sh bash -ec '
            export CARGO_BUILD_JOBS=2
            git config --global --add safe.directory "*"
            cargo xtask oracle info
            cargo test --locked --release -p ocio --lib --no-run --message-format=json > kept/sde-fresh-process-trial/compiler-artifacts.jsonl
            scripts/sde.sh snb python3 scripts/diagnostics/sde_fresh_process_trial.py
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-sde-${{ runner.os }}
          path: kept/sde-fresh-process-trial/
          retention-days: 30
