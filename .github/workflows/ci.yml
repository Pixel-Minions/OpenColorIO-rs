# Native-only diagnostic branch. NEVER MERGE.
name: Independent native replay of public finite fixtures
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    name: Native replay (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 40950573272
          name: public-finite-fixtures-${{ matrix.profile }}
          path: kept/finite-failure-probes/
      - name: Verify exact native source
        run: |
          git fetch --depth=1 origin a8e13fe545333b032128488c7cb43e745b202b67
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ci.yml'
          printf '%s\n' a8e13fe545333b032128488c7cb43e745b202b67 > kept/finite-failure-probes/native-source-commit.txt
          git rev-parse HEAD > kept/finite-failure-probes/native-validation-commit.txt
      - name: Build the unchanged native runtime image
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Replay without compiling or linking any Rust or OCIO renderer
        run: |
          set -o pipefail
          scripts/rocky9.sh bash -ec '
            python3 crates/ocio-gpu-exec/tests/native/prepare_finite_replay.py /work/kept/finite-failure-probes
            for optimization in 0 2; do
              c++ -std=c++17 -O$optimization -ffp-contract=off crates/ocio-gpu-exec/tests/native/finite_replay.cpp -ldl -o kept/finite-failure-probes/native-replay-O$optimization
              kept/finite-failure-probes/native-replay-O$optimization kept/finite-failure-probes/native-manifest.txt O$optimization > kept/finite-failure-probes/native-O$optimization.json
              c++ -std=c++17 -O$optimization -ffp-contract=off crates/ocio-gpu-exec/tests/native/power_precision.cpp -ldl -o kept/finite-failure-probes/power-probe-O$optimization
              kept/finite-failure-probes/power-probe-O$optimization kept/finite-failure-probes O$optimization > kept/finite-failure-probes/power-O$optimization.json
              # Original identity above remains mandatory. These separate
              # version/precision experiments record changes; probe errors fail.
              for variant in version400 precise; do
                if kept/finite-failure-probes/native-replay-O$optimization kept/finite-failure-probes/native-$variant-manifest.txt $variant-O$optimization > kept/finite-failure-probes/native-$variant-O$optimization.json; then
                  :
                else
                  result=$?
                  test "$result" = 1
                fi
              done
            done
          ' 2>&1 | tee kept/finite-failure-probes/native-replay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-public-finite-${{ matrix.profile }}
          path: kept/finite-failure-probes/
          retention-days: 30
