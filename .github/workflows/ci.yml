# Diagnostic only: NEVER MERGE. Five complete original cases; not full SDE coverage.
name: P43 SDE runtime budget
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
  OCIO_RS_ORACLE_NO_CACHE: "1"
  OCIO_RS_TIER: quick
jobs:
  budget:
    name: P43 budget (${{ matrix.os }}, ${{ matrix.cpu }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [windows-2025, ubuntu-24.04]
        cpu: [nhm, hsw]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Immutable source, no test changes
        run: |
          mkdir -p kept/p43-budget
          git fetch --depth=1 origin 5a3f1474d5c819aa66a27a759528559902be9e4e
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse FETCH_HEAD > kept/p43-budget/source-commit.txt
          git rev-parse HEAD > kept/p43-budget/validation-commit.txt
          git fetch --depth=1 origin be369c75000cefebfc8faf992b553add930ff6ae
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sde
      - uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-${{ runner.os }}
      - name: Windows five original long cases
        if: runner.os == 'Windows'
        run: |
          set -e -o pipefail
          {
            cargo fmt --all --check
            cargo xtask ci --base be369c75000cefebfc8faf992b553add930ff6ae
            cargo xtask oracle info
            cargo cpu-tests --release --no-run
            scripts/sde.sh ${{ matrix.cpu }} python scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- builtin_transform_shaders_match_the_wheel upstream_test_configs_match_the_wheel matrix_transform_matches_the_wheel_at_every_format_and_level grading_rgb_curve_transform_matches_the_wheel_at_every_format_and_level
          } 2>&1 | tee kept/p43-budget/budget.log
      - name: Rocky reference image
        if: runner.os == 'Linux'
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Allow SDE tracing
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Rocky five original long cases
        if: runner.os == 'Linux'
        run: |
          set -e -o pipefail
          scripts/rocky9.sh bash -ec '
            export OCIO_RS_TIER=quick CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1
            git config --global --add safe.directory "*"
            cargo fmt --all --check
            cargo xtask ci --base be369c75000cefebfc8faf992b553add930ff6ae
            cargo xtask oracle info
            cargo cpu-tests --release --no-run
            scripts/sde.sh ${{ matrix.cpu }} python3 scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- builtin_transform_shaders_match_the_wheel upstream_test_configs_match_the_wheel matrix_transform_matches_the_wheel_at_every_format_and_level grading_rgb_curve_transform_matches_the_wheel_at_every_format_and_level
          ' 2>&1 | tee kept/p43-budget/budget.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p43-${{ runner.os }}-${{ matrix.cpu }}
          path: |
            kept/p43-budget/
            kept/sde-cpu-tests/
          retention-days: 30
