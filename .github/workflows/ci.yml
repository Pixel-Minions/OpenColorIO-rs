# Diagnostic only. NEVER MERGE.
name: Original C++ GPU comparison replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OCIO_RS_ORACLE_NO_CACHE: "1"
jobs:
  native:
    name: Native upstream comparator (Rocky Linux 9, O0 and O2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Exact diagnostic source and pinned upstream
        run: |
          mkdir -p kept/native-comparator
          git fetch --depth=1 origin 0d9ee2155ce332c17b5108e4d99d2da7a914cb03
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse HEAD > kept/native-comparator/validation-commit.txt
          git rev-parse FETCH_HEAD > kept/native-comparator/source-commit.txt
          git submodule status upstream/OpenColorIO > kept/native-comparator/upstream-commit.txt
      - name: Read the preserved public upstream-fixture captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40950573272 --repo Pixel-Minions/OpenColorIO-rs --name public-finite-fixtures-debug --dir kept/comparator-capture/debug
          gh run download 40950573272 --repo Pixel-Minions/OpenColorIO-rs --name public-finite-fixtures-release --dir kept/comparator-capture/release
      - name: Rocky reference image
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Verbatim upstream comparison and equal-reference controls
        run: |
          set -o pipefail
          scripts/rocky9.sh bash -ec '
            g++ --version
            python3 scripts/diagnostics/upstream_gpu_comparator.py kept/comparator-capture
          ' 2>&1 | tee kept/native-comparator/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-upstream-comparator
          path: kept/native-comparator/
          retention-days: 30
