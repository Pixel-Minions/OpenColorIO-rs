# Diagnostic branch only. NEVER MERGE this workflow or capture instrumentation.
name: Public upstream finite GPU diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
  OCIO_RS_ORACLE_NO_CACHE: "1"
jobs:
  finite:
    name: Public fixture probes (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Verify the exact public capture source
        run: |
          mkdir -p kept/finite-failure-probes
          git fetch --depth=1 origin 2729ed5afc927879b0036b372bdd765526c36a6b
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse HEAD > kept/finite-failure-probes/validation-commit.txt
          printf '%s\n' '2729ed5afc927879b0036b372bdd765526c36a6b' > kept/finite-failure-probes/source-commit.txt
      - name: Build the unchanged reference image
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Capture the five public fixtures, keeping original failures
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          scripts/rocky9.sh bash -s -- "$PROFILE" <<'SH' 2>&1 | tee kept/finite-failure-probes/tests.log
          set -eu
          export CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1 LP_NUM_THREADS=1
          export OCIO_GPU_FINITE_CAPTURE=/work/kept/finite-failure-probes
          git config --global --add safe.directory '*'
          flag=""
          if [ "$1" = release ]; then flag="--release"; fi
          cargo fmt --all --check
          outcome=0
          for test_name in aces2::style_aces2_4000nit_p3_rndtrip aces2::style_aces2_nan_bug aces2::style_aces2_rec709_rndtrip aces2::style_aces2_rgb_to_jmh_fwd style_aces_gamutcomp13_inv; do
            if cargo test --locked -j2 -p ocio-gpu-exec $flag --test fixed_function_op_test "$test_name" -- --exact --test-threads=1 --show-output; then
              :
            else
              outcome=1
            fi
          done
          python3 crates/ocio-gpu-exec/tests/native/prepare_finite_replay.py /work/kept/finite-failure-probes
          for optimization in 0 2; do
            c++ -std=c++17 -O$optimization -ffp-contract=off crates/ocio-gpu-exec/tests/native/finite_replay.cpp -ldl -o kept/finite-failure-probes/native-replay-O$optimization
            kept/finite-failure-probes/native-replay-O$optimization kept/finite-failure-probes/native-manifest.txt O$optimization > kept/finite-failure-probes/native-O$optimization.json
          done
          exit "$outcome"
          SH
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-finite-fixtures-${{ matrix.profile }}
          path: kept/finite-failure-probes/
          retention-days: 30
