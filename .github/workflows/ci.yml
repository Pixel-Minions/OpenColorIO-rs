# Temporary exact-source GPU validation only. NEVER MERGE this ci.yml.
name: P40 GPU exact pins
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
  OCIO_RS_ORACLE_NO_CACHE: "1"
jobs:
  gpu:
    name: P40 (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        profile: [debug, release]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Immutable source
        run: |
          mkdir -p kept/p40-validation
          git fetch --depth=1 origin f627535145e78760c5e8769743a86bfb6c3f66f9
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse FETCH_HEAD > kept/p40-validation/source-commit.txt
          git rev-parse HEAD > kept/p40-validation/validation-commit.txt
          git fetch --depth=1 origin 8e670f3399d1477688635d74c7e7be04edd49c01
      - uses: Swatinem/rust-cache@v2
        with:
          key: p40-${{ runner.os }}-${{ matrix.profile }}
      - name: Windows schema and rejection controls
        if: runner.os == 'Windows'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -e -o pipefail
          flag=""
          if [ "$PROFILE" = release ]; then flag="--release"; fi
          {
            rustup show active-toolchain
            cargo fmt --all --check
            cargo xtask ci --base 8e670f3399d1477688635d74c7e7be04edd49c01
            cargo xtask parity
            cargo xtask ratchet --update
            cargo xtask ci --main --base 8e670f3399d1477688635d74c7e7be04edd49c01
            mkdir -p kept/p40-validation/generated
            cp docs/parity.md docs/ratchet.toml kept/p40-validation/generated/
            cargo clippy --locked -j2 -p ocio-testkit --all-targets -- -D warnings
            cargo test --locked -j2 -p ocio-testkit $flag --lib gpu_waivers -- --nocapture --test-threads=1
          } 2>&1 | tee kept/p40-validation/validation.log
      - name: Rocky reference image
        if: runner.os == 'Linux'
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Original GPU suite and exact-pin controls
        if: runner.os == 'Linux'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -e -o pipefail
          flag=""
          if [ "$PROFILE" = release ]; then flag="--release"; fi
          scripts/rocky9.sh bash -ec "
            export CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1
            git config --global --add safe.directory '*'
            cargo fmt --all --check
            cargo xtask ci --base 8e670f3399d1477688635d74c7e7be04edd49c01
            cargo xtask parity
            cargo xtask ratchet --update
            cargo xtask ci --main --base 8e670f3399d1477688635d74c7e7be04edd49c01
            mkdir -p kept/p40-validation/generated
            cp docs/parity.md docs/ratchet.toml kept/p40-validation/generated/
            cargo clippy --locked -j2 -p ocio-testkit -p ocio-gpu-exec --all-targets -- -D warnings
            cargo test --locked -j2 -p ocio-testkit $flag --lib gpu_waivers -- --nocapture --test-threads=1
            cargo test --locked -j2 -p ocio-gpu-exec $flag -- --nocapture --test-threads=1
          " 2>&1 | tee kept/p40-validation/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p40-${{ runner.os }}-${{ matrix.profile }}
          path: |
            kept/p40-validation/
            kept/gpu-validation/
          retention-days: 30
