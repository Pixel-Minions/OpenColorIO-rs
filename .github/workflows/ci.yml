# Diagnostic only: NEVER MERGE. Two complete legacy sweeps; not full SDE coverage.
name: P47 SDE runtime budget
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
  OCIO_RS_ORACLE_NO_CACHE: "1"
  OCIO_RS_TIER: quick
jobs:
  budget:
    name: P47 legacy budget (${{ matrix.os }}, ${{ matrix.case }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [windows-2025, ubuntu-24.04]
        case: [small_legacy_lattices_and_cache_order_match_native_wheel, legacy_dynamic_positions_and_snapshot_values_match_native_wheel]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Immutable source, no test changes
        run: |
          mkdir -p kept/p47-budget
          git fetch --depth=1 origin a28cfa27bac441fba748c888a5d274270d15eb72
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse FETCH_HEAD > kept/p47-budget/source-commit.txt
          git rev-parse HEAD > kept/p47-budget/validation-commit.txt
          git fetch --depth=1 origin be369c75000cefebfc8faf992b553add930ff6ae
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sde
      - uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-${{ runner.os }}
      - name: Windows one complete legacy sweep
        if: runner.os == 'Windows'
        run: |
          set -e -o pipefail
          {
            cargo fmt --all --check
            cargo xtask ci --base be369c75000cefebfc8faf992b553add930ff6ae
            cargo xtask oracle info
            cargo cpu-tests --release --no-run
            scripts/sde.sh nhm python scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- ${{ matrix.case }} --exact
          } 2>&1 | tee kept/p47-budget/budget.log
      - name: Rocky reference image
        if: runner.os == 'Linux'
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Allow SDE tracing
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Rocky one complete legacy sweep
        if: runner.os == 'Linux'
        run: |
          set -e -o pipefail
          scripts/rocky9.sh bash -ec '
            export OCIO_RS_TIER=quick CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1
            git config --global --add safe.directory "*"
            cargo fmt --all --check
            cargo xtask ci --base be369c75000cefebfc8faf992b553add930ff6ae
            cargo xtask oracle info
            cargo cpu-tests --release --no-run
            scripts/sde.sh nhm python3 scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- ${{ matrix.case }} --exact
          ' 2>&1 | tee kept/p47-budget/budget.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p47-${{ runner.os }}-${{ matrix.case }}
          path: |
            kept/p47-budget/
            kept/sde-cpu-tests/
          retention-days: 30
