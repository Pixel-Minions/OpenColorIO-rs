# Temporary runner validation only. NEVER MERGE this ci.yml.
name: P30 complete-manifest runner smoke and controls
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
  OCIO_RS_ORACLE_NO_CACHE: "1"
  OCIO_RS_TIER: quick
jobs:
  smoke:
    name: P30 runner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Exact source identity
        run: |
          mkdir -p kept/p30-validation
          git fetch --depth=1 origin 7e1a5c5ba6df145aa260b656c404acc0bd46f5af
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse FETCH_HEAD > kept/p30-validation/source-commit.txt
          git rev-parse HEAD > kept/p30-validation/validation-commit.txt
          git fetch --depth=1 origin bb1f1a4b3f7ac9c1d4a2075741ee3fda7d7f2ef3
          git diff --exit-code FETCH_HEAD HEAD -- crates oracle .cargo scripts/sde.sh fixtures waivers.toml
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sde
      - uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
      - name: Windows real runner smoke and four rejection controls
        if: runner.os == 'Windows'
        run: |
          set -e -o pipefail
          {
            rustup show active-toolchain
            cargo xtask guards
            cargo xtask oracle info
            scripts/sde.sh hsw python scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- apphelpers::mergeconfigs::section_merger::oracle_tests::whole_merge_parts_cover_original_cases_once --exact
            scripts/sde.sh hsw python scripts/diagnostics/p30_runner_controls.py
          } 2>&1 | tee kept/p30-validation/validation.log
      - name: Rocky reference image
        if: runner.os == 'Linux'
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Rocky real runner smoke and four rejection controls
        if: runner.os == 'Linux'
        run: |
          set -e -o pipefail
          scripts/rocky9.sh bash -ec '
            export CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1
            git config --global --add safe.directory "*"
            cargo xtask guards
            cargo xtask oracle info
            scripts/sde.sh snb python3 scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- apphelpers::mergeconfigs::section_merger::oracle_tests::whole_merge_parts_cover_original_cases_once --exact
            scripts/sde.sh snb python3 scripts/diagnostics/p30_runner_controls.py
          ' 2>&1 | tee kept/p30-validation/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p30-smoke-${{ runner.os }}
          path: |
            kept/p30-validation/
            kept/sde-cpu-tests/
            kept/p30-controls/
          retention-days: 30
