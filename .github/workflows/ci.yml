# Temporary diagnostic branch only. Do not merge this replacement workflow.
name: GPU non-finite root-cause probes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimal-llvmpipe:
    name: Minimal llvmpipe shaders
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build the unchanged Rocky reference image
        run: docker build -t ocio-gpu-probe:diagnostic docker/rocky9
      - name: Record source and image identity
        run: |
          mkdir -p evidence/O0 evidence/O2
          git rev-parse HEAD > evidence/source-commit.txt
          sha256sum tools/gpu-root-cause/* docker/rocky9/Dockerfile > evidence/source-sha256.txt
          docker image inspect --format '{{.Id}}' ocio-gpu-probe:diagnostic > evidence/image-id.txt
      - name: Run direct EGL and GL probes without the port
        run: |
          for profile in O0 O2; do
            docker run --rm --pull=never --network none --read-only \
              --memory 2g --memory-swap 2g --cpus 1 --pids-limit 128 \
              --tmpfs /build:rw,nosuid,nodev,exec,size=128m \
              --tmpfs /tmp:rw,nosuid,nodev,size=128m \
              --mount "type=bind,source=$PWD/tools/gpu-root-cause,target=/probe,readonly" \
              --mount "type=bind,source=$PWD/evidence/$profile,target=/evidence" \
              --env EGL_PLATFORM=surfaceless --env LIBGL_ALWAYS_SOFTWARE=true \
              --env GALLIUM_DRIVER=llvmpipe --env LP_NUM_THREADS=1 \
              ocio-gpu-probe:diagnostic timeout --kill-after=10s 180 \
              /bin/bash /probe/inside-ci.sh "$profile"
          done
      - name: Analyze raw observations and finite controls
        run: python3 -I -B tools/gpu-root-cause/analyze.py evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-nonfinite-root-cause
          path: evidence/
          retention-days: 14
