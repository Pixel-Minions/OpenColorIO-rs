name: CI

on:
  push:
    branches: [main, "ocio-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# `cargo xtask ci` runs in branch mode (ported tests at least the base's docs/ratchet.toml)
# except on `main`, and on a pull request whose head is a land commit (`cargo xtask land`'s
# merge, with its `Landed-From:` trailer), which `main` then fast-forwards to. Those run
# `cargo xtask ci --main`, which also checks that docs/ratchet.toml and docs/parity.md are
# current. The "xtask ci mode" step of each platform's checks job runs scripts/ci-mode.sh,
# which decides and fetches the base commit.
#
# Each platform runs as parallel jobs: one for fmt, clippy, `xtask ci` and the committed
# fixtures, and test jobs that each run one shard of the workspace tests
# (`cargo xtask test-shard <shard>`; the shards are in xtask/src/shards.rs, whose tests check
# that each platform runs every test exactly once per profile and that the matrices below list
# every shard once). The required checks are the jobs "Windows x86-64" and "Linux x86-64
# (Rocky Linux 9)": each waits for every job of its platform and passes only if all of them
# passed (a failed, cancelled or skipped one fails it).

jobs:
  # Both reference platforms (PLAN.md D11) run the live oracle: pixel checks compare the port
  # with the opencolorio==2.5.2 wheel on the same machine. The oracle test battery runs its
  # full tier here (OCIO_RS_TIER, ocio_testkit::battery::Tier); quick is the local default.
  windows-checks:
    name: Windows checks
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: xtask ci mode
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/ci-mode.sh >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: checks
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - name: Guardrails, fixtures, ratchet (--main also parity)
        run: cargo xtask ci ${{ steps.mode.outputs.flags }}
      - name: Committed fixtures are identical on this platform
        run: cargo xtask oracle check-all

  windows-tests:
    name: Windows tests (${{ matrix.shard }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        shard:
          - windows-debug-formats
          - windows-debug-heavy
          - windows-debug-rest
          - windows-release-formats
          - windows-release-heavy
          - windows-release-rest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.shard }}
      # Release tests too: optimization must not change any bit.
      - name: Tests
        run: cargo xtask test-shard ${{ matrix.shard }}
        env:
          OCIO_RS_TIER: full

  windows:
    name: Windows x86-64
    needs: [windows-checks, windows-tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every Windows job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null

  rocky9-checks:
    name: Linux checks (Rocky Linux 9)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: xtask ci mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/ci-mode.sh >> "$GITHUB_OUTPUT"
      - name: Build the reference image
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: fmt, clippy, guardrails, fixtures
        run: |
          scripts/rocky9.sh bash -ec '
            git config --global --add safe.directory "*"
            cargo fmt --all --check
            cargo clippy --workspace --all-targets
            cargo xtask ci ${{ steps.mode.outputs.flags }}
            cargo xtask oracle check-all
          '

  rocky9-tests:
    name: Linux tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard:
          - linux-debug-formats
          - linux-debug-rest
          - linux-release-formats
          - linux-release-rest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Build the reference image
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      # scripts/rocky9.sh passes OCIO_RS_TIER into the container.
      - name: Tests
        env:
          OCIO_RS_TIER: full
        run: |
          scripts/rocky9.sh bash -ec '
            git config --global --add safe.directory "*"
            cargo xtask test-shard ${{ matrix.shard }}
          '

  rocky9:
    name: Linux x86-64 (Rocky Linux 9)
    needs: [rocky9-checks, rocky9-tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every Linux job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
