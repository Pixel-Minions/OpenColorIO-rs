# Diagnostic only. NEVER MERGE this workflow.
name: Pinned SDE cumulative-thread reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  OCIO_RS_ORACLE_NO_CACHE: "1"
jobs:
  help:
    name: Sequential SDE threads (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
      - name: Collect official help from the existing pinned runtime
        run: |
          mkdir -p kept/sde-thread-probe
          git rev-parse HEAD > kept/sde-thread-probe/source-commit.txt
          scripts/sde.sh hsw bash -c '
            case "$(uname -s)" in
              MINGW*|MSYS*|CYGWIN*) executable="$PWD/target/sde/sde-external-10.13.1-2026-07-28-win/sde.exe" ;;
              Linux) executable="$PWD/target/sde/sde-external-10.13.1-2026-07-28-lin/sde64" ;;
              *) exit 2 ;;
            esac
            "$executable" -long-help > kept/sde-thread-probe/long-help.txt 2>&1
            result=$?
            printf "%s\n" "$result" > kept/sde-thread-probe/help-exit-code.txt
            test -s kept/sde-thread-probe/long-help.txt
          '
      - name: Reproduce the default limit and prove its documented override
        run: |
          rustup show active-toolchain
          scripts/sde.sh hsw python scripts/diagnostics/sde-thread-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-sde-help-${{ runner.os }}
          path: kept/sde-thread-probe/
          retention-days: 30
