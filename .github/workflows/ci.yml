# Diagnostic only. NEVER MERGE.
name: SDE lifetime thread limit probe
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  OCIO_RS_ORACLE_NO_CACHE: "1"
jobs:
  lifetime:
    name: Lifetime thread probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
      - name: Original pinned runtime and sequential thread creation
        run: |
          mkdir -p kept/sde-lifetime-probe
          git rev-parse HEAD > kept/sde-lifetime-probe/validation-commit.txt
          rustup show active-toolchain
          if [ "$RUNNER_OS" = Windows ]; then cpu=hsw; else cpu=snb; fi
          scripts/sde.sh "$cpu" python scripts/diagnostics/sde_lifetime_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sde-lifetime-${{ runner.os }}
          path: kept/sde-lifetime-probe/
          retention-days: 30
