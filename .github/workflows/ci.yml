name: CI

on:
  push:
    branches: [main, "ocio-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# `cargo xtask ci` runs in branch mode (ported tests at least the base's docs/ratchet.toml)
# except on `main`, and on a pull request whose head is a land commit (`cargo xtask land`'s
# merge, with its `Landed-From:` trailer), which `main` then fast-forwards to. Those run
# `cargo xtask ci --main`, which also checks that docs/ratchet.toml and docs/parity.md are
# current. The "xtask ci mode" step in each job runs scripts/ci-mode.sh, which decides and
# fetches the base commit.

jobs:
  # Both reference platforms (PLAN.md D11) run the live oracle: pixel checks compare the port
  # with the opencolorio==2.5.2 wheel on the same machine.
  windows:
    name: Windows x86-64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: xtask ci mode
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/ci-mode.sh >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - name: Guardrails, fixtures, ratchet (--main also parity)
        run: cargo xtask ci ${{ steps.mode.outputs.flags }}
      - run: cargo test --workspace --no-fail-fast
      - name: Tests in release (optimization must not change any bit)
        run: cargo test --workspace --release --no-fail-fast
      - name: Committed fixtures are identical on this platform
        run: cargo xtask oracle check-all

  rocky9:
    name: Linux x86-64 (Rocky Linux 9)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: xtask ci mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/ci-mode.sh >> "$GITHUB_OUTPUT"
      - name: Build the reference image
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: fmt, clippy, guardrails, tests, fixtures
        run: |
          scripts/rocky9.sh bash -ec '
            git config --global --add safe.directory "*"
            cargo fmt --all --check
            cargo clippy --workspace --all-targets
            cargo xtask ci ${{ steps.mode.outputs.flags }}
            cargo test --workspace --no-fail-fast
            cargo test --workspace --release --no-fail-fast
            cargo xtask oracle check-all
          '

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
