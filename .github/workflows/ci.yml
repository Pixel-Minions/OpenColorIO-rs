# Temporary CPU validation only. NEVER MERGE this workflow.
name: Deferred ColorSpaceSet coverage validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
  OCIO_RS_ORACLE_NO_CACHE: "1"
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
jobs:
  cpu:
    name: ColorSpaceSet (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        profile: [debug, release]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Exact source identity
        run: |
          mkdir -p kept/cpu-validation
          git fetch --depth=1 origin refs/heads/codex/p23-cpu-catchup
          source=$(git rev-parse FETCH_HEAD)
          git diff --exit-code "$source" HEAD -- . ':(exclude).github/workflows/ci.yml'
          printf '%s\n' "$source" > kept/cpu-validation/source-commit.txt
          git rev-parse HEAD > kept/cpu-validation/validation-commit.txt
          git fetch --depth=1 origin a25b4d19bc97198cb57d77a2952e429b68a3967b
      - uses: Swatinem/rust-cache@v2
        with:
          key: p23-${{ runner.os }}-${{ matrix.profile }}
      - name: Pinned Windows toolchain
        if: runner.os == 'Windows'
        run: rustup show active-toolchain
      - name: Rocky reference image
        if: runner.os == 'Linux'
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Windows guardrails, target clippy and original four tests
        if: runner.os == 'Windows'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -e -o pipefail
          flag=""
          if [ "$PROFILE" = release ]; then flag="--release"; fi
          {
            cargo fmt --all --check
            cargo xtask ci --base a25b4d19bc97198cb57d77a2952e429b68a3967b
            cargo xtask parity
            cargo xtask ratchet --update
            cargo xtask ci --main --base a25b4d19bc97198cb57d77a2952e429b68a3967b
            mkdir -p kept/cpu-validation/generated
            cp docs/parity.md docs/ratchet.toml kept/cpu-validation/generated/
            cargo clippy --locked -j2 -p ocio --test color_space_set_tests -- -D warnings
            cargo test --locked -j2 -p ocio $flag --test color_space_set_tests -- --test-threads=1 --show-output
          } 2>&1 | tee kept/cpu-validation/validation.log
      - name: Rocky guardrails, target clippy and original four tests
        if: runner.os == 'Linux'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          flag=""
          if [ "$PROFILE" = release ]; then flag="--release"; fi
          scripts/rocky9.sh bash -ec "
            export CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1
            git config --global --add safe.directory '*'
            cargo fmt --all --check
            cargo xtask ci --base a25b4d19bc97198cb57d77a2952e429b68a3967b
            cargo xtask parity
            cargo xtask ratchet --update
            cargo xtask ci --main --base a25b4d19bc97198cb57d77a2952e429b68a3967b
            mkdir -p kept/cpu-validation/generated
            cp docs/parity.md docs/ratchet.toml kept/cpu-validation/generated/
            cargo clippy --locked -j2 -p ocio --test color_space_set_tests -- -D warnings
            cargo test --locked -j2 -p ocio $flag --test color_space_set_tests -- --test-threads=1 --show-output
          " 2>&1 | tee kept/cpu-validation/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p23-${{ runner.os }}-${{ matrix.profile }}
          path: kept/
          retention-days: 30
