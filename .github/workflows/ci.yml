# Diagnostic workflow only. NEVER MERGE.
name: Texture reader startup validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
  OCIO_RS_ORACLE_NO_CACHE: "1"
jobs:
  readers:
    name: Texture readers (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        profile: [debug, release]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Exact source identity
        run: |
          mkdir -p kept/reader-validation
          git fetch --depth=1 origin 15fc77f61ee5b49d985017ae3664d3c5acd12073
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ci.yml' ':(exclude)scripts/diagnostics/reader_startup_validation.py'
          git rev-parse FETCH_HEAD > kept/reader-validation/source-commit.txt
          git rev-parse HEAD > kept/reader-validation/validation-commit.txt
          git fetch --depth=1 origin d91b9c088f066e991a79ffa4278c8d8b2f18c252
      - uses: Swatinem/rust-cache@v2
        with:
          key: reader-startup-${{ runner.os }}-${{ matrix.profile }}
      - name: Windows toolchain
        if: runner.os == 'Windows'
        run: rustup show active-toolchain
      - name: Rocky reference image
        if: runner.os == 'Linux'
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Windows guards and five complete repeated concurrency tests
        if: runner.os == 'Windows'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -e -o pipefail
          {
            cargo fmt --all --check
            cargo xtask ci --base d91b9c088f066e991a79ffa4278c8d8b2f18c252
            cargo xtask parity
            cargo xtask ratchet --update
            cargo xtask ci --main --base d91b9c088f066e991a79ffa4278c8d8b2f18c252
            mkdir -p kept/reader-validation/generated
            cp docs/parity.md docs/ratchet.toml kept/reader-validation/generated/
            python scripts/diagnostics/reader_startup_validation.py
          } 2>&1 | tee kept/reader-validation/validation.log
      - name: Rocky guards and five complete repeated concurrency tests
        if: runner.os == 'Linux'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          scripts/rocky9.sh bash -ec '
            export PROFILE="${{ matrix.profile }}" CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1
            git config --global --add safe.directory "*"
            cargo fmt --all --check
            cargo xtask ci --base d91b9c088f066e991a79ffa4278c8d8b2f18c252
            cargo xtask parity
            cargo xtask ratchet --update
            cargo xtask ci --main --base d91b9c088f066e991a79ffa4278c8d8b2f18c252
            mkdir -p kept/reader-validation/generated
            cp docs/parity.md docs/ratchet.toml kept/reader-validation/generated/
            python3 scripts/diagnostics/reader_startup_validation.py
          ' 2>&1 | tee kept/reader-validation/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-${{ runner.os }}-${{ matrix.profile }}
          path: kept/reader-validation/
          retention-days: 30
