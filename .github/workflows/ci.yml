# Temporary legacy parity validation only. NEVER MERGE this ci.yml.
name: P32 small legacy shader and texture parity
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
  OCIO_RS_ORACLE_NO_CACHE: "1"
jobs:
  parity:
    name: P32 legacy (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        profile: [debug, release]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Immutable source and prerequisite
        run: |
          mkdir -p kept/p32-validation
          git fetch --depth=1 origin 14b03497379c07d8f193ddf71fa43e301029fda8
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse FETCH_HEAD > kept/p32-validation/source-commit.txt
          git rev-parse HEAD > kept/p32-validation/validation-commit.txt
          git fetch --depth=1 origin db540dbb56ed2094d78538ce695a551234487574
          git diff --exit-code FETCH_HEAD HEAD -- oracle fixtures waivers.toml crates/ocio/src crates/ocio-ops crates/ocio-gpu crates/ocio-gpu-exec
      - uses: Swatinem/rust-cache@v2
        with:
          key: p32-${{ runner.os }}-${{ matrix.profile }}
      - name: Windows legacy comparison
        if: runner.os == 'Windows'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -e -o pipefail
          flag=""
          if [ "$PROFILE" = release ]; then flag="--release"; fi
          {
            rustup show active-toolchain
            cargo fmt --all --check
            cargo xtask ci --base db540dbb56ed2094d78538ce695a551234487574
            cargo xtask parity
            cargo xtask ratchet --update
            cargo xtask ci --main --base db540dbb56ed2094d78538ce695a551234487574
            mkdir -p kept/p32-validation/generated
            cp docs/parity.md docs/ratchet.toml kept/p32-validation/generated/
            cargo clippy --locked -j2 -p ocio --test legacy_gpu_oracle -- -D warnings
            cargo test --locked -j2 -p ocio $flag --test legacy_gpu_oracle -- --nocapture --test-threads=1
          } 2>&1 | tee kept/p32-validation/validation.log
      - name: Rocky reference image
        if: runner.os == 'Linux'
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Rocky legacy comparison
        if: runner.os == 'Linux'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -e -o pipefail
          flag=""
          if [ "$PROFILE" = release ]; then flag="--release"; fi
          scripts/rocky9.sh bash -ec "
            export CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1
            git config --global --add safe.directory '*'
            cargo fmt --all --check
            cargo xtask ci --base db540dbb56ed2094d78538ce695a551234487574
            cargo xtask parity
            cargo xtask ratchet --update
            cargo xtask ci --main --base db540dbb56ed2094d78538ce695a551234487574
            mkdir -p kept/p32-validation/generated
            cp docs/parity.md docs/ratchet.toml kept/p32-validation/generated/
            cargo clippy --locked -j2 -p ocio --test legacy_gpu_oracle -- -D warnings
            cargo test --locked -j2 -p ocio $flag --test legacy_gpu_oracle -- --nocapture --test-threads=1
          " 2>&1 | tee kept/p32-validation/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p32-${{ runner.os }}-${{ matrix.profile }}
          path: kept/p32-validation/
          retention-days: 30
