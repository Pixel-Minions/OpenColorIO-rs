# Diagnostic only. NEVER MERGE this ci.yml. One live audit, not full CPU coverage.
name: P41 SDE partition protocol
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
  OCIO_RS_ORACLE_NO_CACHE: "1"
  OCIO_RS_TIER: quick
jobs:
  shards:
    name: P41 protocol (${{ matrix.os }}, shard${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os: [windows-2025, ubuntu-24.04]
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Immutable source
        run: |
          mkdir -p kept/p41-validation
          git fetch --depth=1 origin 06497aceeec20d31c9efc15f5753fb550c1261e7
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse FETCH_HEAD > kept/p41-validation/source-commit.txt
          git rev-parse HEAD > kept/p41-validation/validation-commit.txt
          git fetch --depth=1 origin db540dbb56ed2094d78538ce695a551234487574
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sde
      - uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-${{ runner.os }}
      - name: Windows actual partition protocol
        if: runner.os == 'Windows'
        run: |
          set -e -o pipefail
          {
            cargo fmt --all --check
            cargo xtask ci --base db540dbb56ed2094d78538ce695a551234487574
            cargo xtask oracle info
            cargo cpu-tests --release --no-run
            export OCIO_RS_SDE_SHARD="${{ matrix.shard }}/4"
            scripts/sde.sh hsw python scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- apphelpers::mergeconfigs::section_merger::oracle_tests::whole_merge_parts_cover_original_cases_once --exact
          } 2>&1 | tee kept/p41-validation/protocol.log
      - name: Rocky reference image
        if: runner.os == 'Linux'
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Allow SDE tracing
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Rocky actual partition protocol
        if: runner.os == 'Linux'
        run: |
          set -e -o pipefail
          scripts/rocky9.sh bash -ec '
            export OCIO_RS_TIER=quick CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1
            git config --global --add safe.directory "*"
            cargo fmt --all --check
            cargo xtask ci --base db540dbb56ed2094d78538ce695a551234487574
            cargo xtask oracle info
            cargo cpu-tests --release --no-run
            export OCIO_RS_SDE_SHARD="${{ matrix.shard }}/4"
            scripts/sde.sh snb python3 scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- apphelpers::mergeconfigs::section_merger::oracle_tests::whole_merge_parts_cover_original_cases_once --exact
          ' 2>&1 | tee kept/p41-validation/protocol.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p41-${{ runner.os }}-${{ matrix.shard }}
          path: |
            kept/p41-validation/
            kept/sde-cpu-tests/
          retention-days: 30
  join:
    name: P41 joined protocol (${{ matrix.system }})
    needs: shards
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        system: [Windows, Linux]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: p41-${{ matrix.system }}-*
          path: kept/p41-inputs
      - name: Complete union and actual-log rejection controls
        run: |
          python3 scripts/diagnostics/p41_shard_controls.py kept/p41-joined             kept/p41-inputs/p41-${{ matrix.system }}-0             kept/p41-inputs/p41-${{ matrix.system }}-1             kept/p41-inputs/p41-${{ matrix.system }}-2             kept/p41-inputs/p41-${{ matrix.system }}-3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p41-joined-${{ matrix.system }}
          path: kept/p41-joined/
          retention-days: 30
