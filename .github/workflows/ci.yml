# Diagnostic only. NEVER MERGE.
name: Actual SDE workload thread trace
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "2"
  OCIO_RS_ORACLE_NO_CACHE: "1"
  OCIO_RS_TIER: quick
jobs:
  trace:
    name: SDE workload (${{ matrix.os }}, threads=${{ matrix.threads }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        threads: [1, 4]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Exact source
        run: |
          mkdir -p kept/sde-workload-trace
          git rev-parse HEAD > kept/sde-workload-trace/validation-commit.txt
          git rev-parse HEAD^ > kept/sde-workload-trace/source-commit.txt
          git diff --exit-code 2f768f6fb69cc53e040f8c3d1d2ea0df1d6dfc0c HEAD -- crates oracle .cargo scripts/sde.sh .github/workflows/sde.yml
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sde
      - uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
      - name: Windows native build and actual HSW workload
        if: runner.os == 'Windows'
        run: |
          rustup show active-toolchain
          cargo xtask oracle info
          cargo test --locked --release -p ocio --lib --no-run
          scripts/sde.sh hsw python scripts/diagnostics/sde_workload_trace.py ${{ matrix.threads }}
      - name: Rocky image
        if: runner.os == 'Linux'
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Rocky native build and actual SNB workload
        if: runner.os == 'Linux'
        run: |
          scripts/rocky9.sh bash -ec '
            export CARGO_BUILD_JOBS=2
            git config --global --add safe.directory "*"
            cargo xtask oracle info
            cargo test --locked --release -p ocio --lib --no-run
            scripts/sde.sh snb python3 scripts/diagnostics/sde_workload_trace.py ${{ matrix.threads }}
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-sde-${{ runner.os }}-threads-${{ matrix.threads }}
          path: kept/sde-workload-trace/
          retention-days: 30
