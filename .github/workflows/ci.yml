# Diagnostic only: NEVER MERGE. Native prebuild plus complete original legacy1680-request case; not full SDE coverage.
name: P52 SDE runtime budget
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
  OCIO_RS_ORACLE_NO_CACHE: "1"
  OCIO_RS_TIER: quick
jobs:
  budget:
    name: P52 budget (${{ matrix.os }}, nhm)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Immutable source, no test changes
        run: |
          mkdir -p kept/p52-budget
          git fetch --depth=1 origin de42828cda0e6e7fdef8cfe2a35922596827406f
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse FETCH_HEAD > kept/p52-budget/source-commit.txt
          git rev-parse HEAD > kept/p52-budget/validation-commit.txt
          git fetch --depth=1 origin be369c75000cefebfc8faf992b553add930ff6ae
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sde
      - uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-${{ runner.os }}
      - name: Windows native prebuild and complete legacy case
        if: runner.os == 'Windows'
        run: |
          set -e -o pipefail
          {
            cargo fmt --all --check
            cargo xtask ci --base be369c75000cefebfc8faf992b553add930ff6ae
            cargo xtask oracle info
            python scripts/sde_native_warmup.py | tee kept/p52-budget/warmup-before.json
            cargo cpu-tests --release --no-run
            scripts/sde.sh nhm python scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- small_legacy_lattices_and_cache_order_match_native_wheel --exact
            python scripts/sde_native_warmup.py | tee kept/p52-budget/warmup-after.json
          } 2>&1 | tee kept/p52-budget/budget.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p52-${{ runner.os }}-nhm
          path: |
            kept/p52-budget/
            kept/sde-cpu-tests/
          retention-days: 30
