# Temporary CPU validation only. NEVER MERGE this workflow.
name: P29 whole-merge partition validation
on:
  workflow_dispatch:
    inputs:
      native_only:
        description: Reuse the existing exact-source SDE trial and run native profiles only
        type: boolean
        default: false
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings
  OCIO_RS_ORACLE_NO_CACHE: "1"
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "1"
jobs:
  cpu:
    name: P29 native (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        profile: [debug, release]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Exact source identity
        run: |
          mkdir -p kept/p29-validation
          git fetch --depth=1 origin bb1f1a4b3f7ac9c1d4a2075741ee3fda7d7f2ef3
          source=$(git rev-parse FETCH_HEAD)
          git diff --exit-code "$source" HEAD -- . ':(exclude).github/workflows/ci.yml'
          printf '%s\n' "$source" > kept/p29-validation/source-commit.txt
          git rev-parse HEAD > kept/p29-validation/validation-commit.txt
          git fetch --depth=1 origin 8e670f3399d1477688635d74c7e7be04edd49c01
      - uses: Swatinem/rust-cache@v2
        with:
          key: p29-${{ runner.os }}-${{ matrix.profile }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Pinned Windows toolchain
        if: runner.os == 'Windows'
        run: rustup show active-toolchain
      - name: Rocky reference image
        if: runner.os == 'Linux'
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Windows guardrails, target clippy and all merge parts and plan controls
        if: runner.os == 'Windows'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -e -o pipefail
          flag=""
          if [ "$PROFILE" = release ]; then flag="--release"; fi
          {
            cargo fmt --all --check
            cargo xtask ci --base 8e670f3399d1477688635d74c7e7be04edd49c01
            cargo xtask parity
            cargo xtask ratchet --update
            cargo xtask ci --main --base 8e670f3399d1477688635d74c7e7be04edd49c01
            mkdir -p kept/p29-validation/generated
            cp docs/parity.md docs/ratchet.toml kept/p29-validation/generated/
            cargo clippy --locked -j2 -p ocio --lib -- -D warnings
            cargo test --locked -j2 -p ocio $flag --lib apphelpers::mergeconfigs::section_merger::oracle_tests:: -- --test-threads=1 --show-output
            if [ "$PROFILE" = debug ]; then python scripts/diagnostics/p29_partition_controls.py; fi
            git diff --exit-code -- crates/ocio/src/apphelpers/mergeconfigs/section_merger_oracle_tests.rs
          } 2>&1 | tee kept/p29-validation/validation.log
      - name: Rocky guardrails, target clippy and all merge parts and plan controls
        if: runner.os == 'Linux'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          flag=""
          if [ "$PROFILE" = release ]; then flag="--release"; fi
          scripts/rocky9.sh bash -ec "
            export CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1
            git config --global --add safe.directory '*'
            cargo fmt --all --check
            cargo xtask ci --base 8e670f3399d1477688635d74c7e7be04edd49c01
            cargo xtask parity
            cargo xtask ratchet --update
            cargo xtask ci --main --base 8e670f3399d1477688635d74c7e7be04edd49c01
            mkdir -p kept/p29-validation/generated
            cp docs/parity.md docs/ratchet.toml kept/p29-validation/generated/
            cargo clippy --locked -j2 -p ocio --lib -- -D warnings
            cargo test --locked -j2 -p ocio $flag --lib apphelpers::mergeconfigs::section_merger::oracle_tests:: -- --test-threads=1 --show-output
            if [ '$PROFILE' = debug ]; then python3 scripts/diagnostics/p29_partition_controls.py; fi
            git diff --exit-code -- crates/ocio/src/apphelpers/mergeconfigs/section_merger_oracle_tests.rs
          " 2>&1 | tee kept/p29-validation/validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p29-${{ runner.os }}-${{ matrix.profile }}
          path: kept/p29-validation/
          retention-days: 30

  sde:
    if: ${{ !inputs.native_only }}
    name: P29 SDE (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Exact source identity
        run: |
          mkdir -p kept/p29-sde
          git fetch --depth=1 origin bb1f1a4b3f7ac9c1d4a2075741ee3fda7d7f2ef3
          git diff --exit-code FETCH_HEAD HEAD -- . ':(exclude).github/workflows/ci.yml'
          git rev-parse FETCH_HEAD > kept/p29-sde/source-commit.txt
          git rev-parse HEAD > kept/p29-sde/validation-commit.txt
          git fetch --depth=1 origin 8e670f3399d1477688635d74c7e7be04edd49c01
          git diff --exit-code FETCH_HEAD HEAD -- oracle .cargo scripts/sde.sh .github/workflows/sde.yml crates/ocio/src/yaml_cpp crates/ocio-ops/src/std_regex crates/ocio-gpu-exec
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sde
      - uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-${{ runner.os == 'Windows' && 'windows' || 'linux' }}
      - name: Windows native build and emulated HSW tests
        if: runner.os == 'Windows'
        run: |
          rustup show active-toolchain
          cargo xtask oracle info
          cargo test --locked --release -p ocio --lib --no-run --message-format=json > kept/p29-sde/compiler-artifacts.jsonl
          scripts/sde.sh hsw python scripts/diagnostics/p29_sde_parts.py
      - name: Rocky reference image
        if: runner.os == 'Linux'
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Rocky native build and emulated SNB tests
        if: runner.os == 'Linux'
        run: |
          scripts/rocky9.sh bash -ec '
            export CARGO_BUILD_JOBS=2 RUST_TEST_THREADS=1
            git config --global --add safe.directory "*"
            cargo xtask oracle info
            cargo test --locked --release -p ocio --lib --no-run --message-format=json > kept/p29-sde/compiler-artifacts.jsonl
            scripts/sde.sh snb python3 scripts/diagnostics/p29_sde_parts.py
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p29-sde-${{ runner.os }}
          path: kept/p29-sde/
          retention-days: 30
