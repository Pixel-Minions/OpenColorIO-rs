name: SDE

# The CPU-dependent tests (`cargo cpu-tests`) on emulated CPUs, with Intel SDE (scripts/sde.sh):
# the official wheel and the port both dispatch to the SIMD kernels of that CPU, so every kernel
# OCIO has is compared with the port's profile for it (PLAN.md §8). The workstation and GitHub's
# runners only cover the kernels their own CPUs select.
#
#   nhm  Nehalem          SSE2 kernels
#   snb  Sandy Bridge     AVX kernels
#   hsw  Haswell          AVX2 with slow gather
#   skl  Skylake          AVX2 kernels
#   skx  Skylake server   AVX-512 kernels
#
# SDE is downloaded from Intel's mirror under Intel's license (accepted by the owner), and
# scripts/sde.sh checks its SHA256 before using it. The archive is cached between runs.
# Kernel jobs retain Cargo's complete selected target/name manifest and run each test in a
# fresh emulator (scripts/sde_cpu_tests.py). Four bounded partitions retain the full plan;
# the profile joiner rejects missing/duplicate cases and checks actual raw pass logs.
# This resets SDE's cumulative thread budget;
# the split whole-config test keeps all original cases and exact comparisons.
#
# On Windows, SDE now and then crashes the oracle (exit code 0xC0000005, "The pipe is being
# closed" while the request is written) as it starts: importing PyOpenColorIO calls
# platform.system(), which under SDE falls back to starting `cmd /c ver` (WMI isn't available),
# and Pin's injection into that child crashes. No command has run then, so the test harness
# starts the oracle again, at most twice (crates/ocio-testkit/src/oracle.rs, crashed_unread).

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      targeted:
        description: Owner-authorized focused execution follow-up; false selects the full matrix
        type: boolean
        required: true
        default: true
      targeted_scope:
        description: owner-snb selects complete snb profiles, boundary audit and both Rocky ICC sweeps
        type: choice
        required: true
        default: all
        options: [all, icc, owner-snb]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "crates/ocio-ops/**"
      - "crates/ocio-testkit/**"
      - "oracle/**"
      - "scripts/sde.sh"
      - "crates/ocio/**"
      - "crates/ocio-gpu/**"
      - "crates/ocio-tools/**"
      - "scripts/sde_join_shards.py"
      - "scripts/diagnostics/p41_shard_controls.py"
      - "scripts/diagnostics/p46_join_order_controls.py"
      - "scripts/diagnostics/p50_schedule_controls.py"
      - "scripts/sde_cpu_tests.py"
      - "scripts/sde_native_warmup.py"
      - ".cargo/config.toml"
      - ".github/workflows/sde.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The oracle's response cache is off in every job: each test asks the wheel, so that an
  # answer cached under a key that missed a change of the oracle (oracle_scope.rs) can never
  # pass CI. rust-cache may restore parts of target/, where that cache lives; scripts/rocky9.sh
  # passes this variable into the container. `cargo xtask guards` checks both.
  OCIO_RS_ORACLE_NO_CACHE: "1"
  # The battery's quick tier: SDE checks which kernels are dispatched; full is too slow emulated.
  OCIO_RS_TIER: quick
  # Two tests of the API format sweep (crates/ocio/tests/api_formats_oracle.rs) run for hours
  # emulated: every CPU job was cancelled at its time limit inside them from 2026-10-15 on, and
  # the kernel tests queued behind them never ran. They run in jobs of their own (part
  # lut-sweep, with a longer limit); the kernels part runs every other CPU test.
  LUT_SWEEP: lut1d_transform_matches_the_wheel_at_every_format_and_level lut3d_transform_matches_the_wheel_at_every_format_and_level
  SKIP_LUT_SWEEP: --skip lut1d_transform_matches_the_wheel_at_every_format_and_level --skip lut3d_transform_matches_the_wheel_at_every_format_and_level

jobs:
  windows-kernels:
    # The owner selects a separate targeted run for PRs carrying this label.
    if: github.event_name == 'workflow_dispatch' && (!inputs.targeted || inputs.targeted_scope == 'owner-snb')
    name: SDE ${{ matrix.cpu }} kernel shard${{ matrix.shard }} (Windows)
    needs: targeted-controls
    runs-on: windows-2025
    # Original comparisons retained; the runner bounds individual executions separately.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        cpu: ${{ fromJSON(inputs.targeted_scope == 'owner-snb' && '["snb"]' || '["nhm","snb","hsw","skl","skx"]') }}
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sde
      - name: Intel SDE archive
        uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-windows
      - name: Oracle environment and test build (native)
        run: |
          cargo xtask oracle info
          cargo cpu-tests --release --no-run
      - name: Build the source-keyed legacy client natively
        run: python scripts/sde_native_warmup.py
      - name: CPU tests on an emulated ${{ matrix.cpu }}
        shell: bash
        run: |
          export OCIO_RS_SDE_SHARD="${{ matrix.shard }}/4"
          scripts/sde.sh ${{ matrix.cpu }} python scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- $SKIP_LUT_SWEEP
      - name: SDE logs
        if: failure()
        shell: bash
        run: find . -name 'pin-*log.txt' -not -path './target/*' -exec tail -n 40 {} +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sde-${{ matrix.cpu }}-Windows-kernel-shard-${{ matrix.shard }}
          path: kept/sde-cpu-tests/
          retention-days: 30

  windows-lut:
    # The owner selects a separate targeted run for PRs carrying this label.
    if: github.event_name == 'workflow_dispatch' && (!inputs.targeted || inputs.targeted_scope == 'owner-snb')
    name: SDE ${{ matrix.cpu }} LUT sweep (Windows)
    needs: targeted-controls
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cpu: ${{ fromJSON(inputs.targeted_scope == 'owner-snb' && '["snb"]' || '["nhm","snb","hsw","skl","skx"]') }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sde
      - name: Intel SDE archive
        uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-windows
      - name: Oracle environment and test build (native)
        run: |
          cargo xtask oracle info
          cargo cpu-tests --release --no-run
      - name: CPU tests on an emulated ${{ matrix.cpu }}
        shell: bash
        run: |
          scripts/sde.sh ${{ matrix.cpu }} python scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- $LUT_SWEEP
      - name: SDE logs
        if: failure()
        shell: bash
        run: find . -name 'pin-*log.txt' -not -path './target/*' -exec tail -n 40 {} +

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sde-${{ matrix.cpu }}-Windows-lut
          path: kept/sde-cpu-tests/
          retention-days: 30

  rocky9-kernels:
    # The owner selects a separate targeted run for PRs carrying this label.
    if: github.event_name == 'workflow_dispatch' && (!inputs.targeted || inputs.targeted_scope == 'owner-snb')
    name: SDE ${{ matrix.cpu }} kernel shard${{ matrix.shard }} (Rocky Linux 9)
    needs: targeted-controls
    runs-on: ubuntu-24.04
    # Original comparisons retained; the runner bounds individual executions separately.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        cpu: ${{ fromJSON(inputs.targeted_scope == 'owner-snb' && '["snb"]' || '["nhm","snb","hsw","skl","skx"]') }}
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Intel SDE archive
        uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-linux
      - name: Build the reference image
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      # SDE (Pin) traces the processes it emulates; Ubuntu's Yama default only lets a process
      # trace its own descendants. This is a throwaway VM.
      - name: Allow SDE to trace processes
        run: sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: CPU tests on an emulated ${{ matrix.cpu }}
        run: |
          scripts/rocky9.sh bash -ec '
            export OCIO_RS_TIER=quick
            cargo xtask oracle info
            python3 scripts/sde_native_warmup.py
            cargo cpu-tests --release --no-run
            export OCIO_RS_SDE_SHARD="${{ matrix.shard }}/4"
            scripts/sde.sh ${{ matrix.cpu }} python3 scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- ${{ env.SKIP_LUT_SWEEP }}
          '
      - name: SDE logs
        if: failure()
        run: find . -name 'pin-*log.txt' -not -path './target/*' -exec tail -n 40 {} +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sde-${{ matrix.cpu }}-Rocky-kernel-shard-${{ matrix.shard }}
          path: kept/sde-cpu-tests/
          retention-days: 30

  rocky9-lut:
    # The owner selects a separate targeted run for PRs carrying this label.
    if: github.event_name == 'workflow_dispatch' && (!inputs.targeted || inputs.targeted_scope == 'owner-snb')
    name: SDE ${{ matrix.cpu }} LUT sweep (Rocky Linux 9)
    needs: targeted-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cpu: ${{ fromJSON(inputs.targeted_scope == 'owner-snb' && '["snb"]' || '["nhm","snb","hsw","skl","skx"]') }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Intel SDE archive
        uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-linux
      - name: Build the reference image
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      # SDE (Pin) traces the processes it emulates; Ubuntu's Yama default only lets a process
      # trace its own descendants. This is a throwaway VM.
      - name: Allow SDE to trace processes
        run: sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: CPU tests on an emulated ${{ matrix.cpu }}
        run: |
          scripts/rocky9.sh bash -ec '
            export OCIO_RS_TIER=quick
            cargo xtask oracle info
            cargo cpu-tests --release --no-run
            scripts/sde.sh ${{ matrix.cpu }} python3 scripts/sde_cpu_tests.py cargo cpu-tests --release --no-fail-fast -- ${{ env.LUT_SWEEP }}
          '
      - name: SDE logs
        if: failure()
        run: find . -name 'pin-*log.txt' -not -path './target/*' -exec tail -n 40 {} +

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sde-${{ matrix.cpu }}-Rocky-lut
          path: kept/sde-cpu-tests/
          retention-days: 30

  kernels:
    name: SDE ${{ matrix.cpu }} (${{ matrix.system == 'Rocky' && 'Rocky Linux 9' || 'Windows' }})
    if: always() && github.event_name == 'workflow_dispatch' && (!inputs.targeted || inputs.targeted_scope == 'owner-snb')
    needs: [windows-kernels, rocky9-kernels, windows-lut, rocky9-lut]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cpu: ${{ fromJSON(inputs.targeted_scope == 'owner-snb' && '["snb"]' || '["nhm","snb","hsw","skl","skx"]') }}
        system: [Windows, Rocky]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: sde-${{ matrix.cpu }}-${{ matrix.system }}-kernel-shard-*
          path: kept/sde-shard-inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: sde-${{ matrix.cpu }}-${{ matrix.system }}-lut
          path: kept/sde-lut-input
      - name: Every original target and selected test passed exactly once
        run: |
          python3 scripts/diagnostics/p50_schedule_controls.py
          python3 scripts/diagnostics/p46_join_order_controls.py
          python3 scripts/sde_join_shards.py kept/sde-cpu-tests-joined/profile             kept/sde-shard-inputs/sde-${{ matrix.cpu }}-${{ matrix.system }}-kernel-shard-0             kept/sde-shard-inputs/sde-${{ matrix.cpu }}-${{ matrix.system }}-kernel-shard-1             kept/sde-shard-inputs/sde-${{ matrix.cpu }}-${{ matrix.system }}-kernel-shard-2             kept/sde-shard-inputs/sde-${{ matrix.cpu }}-${{ matrix.system }}-kernel-shard-3
      - name: Complete CPU alias and strict boundary union
        run: python3 scripts/sde_complete_profile.py --kernel kept/sde-cpu-tests-joined/profile --lut kept/sde-lut-input --output kept/sde-complete-profile/proof.json --cpu ${{ matrix.cpu }} --head ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sde-${{ matrix.cpu }}-${{ matrix.system }}-complete-profile
          path: |
            kept/sde-cpu-tests-joined/
            kept/sde-lut-input/
            kept/sde-complete-profile/
          retention-days: 30

  # The limits of nested transforms and CTF references (docs/improvements.md, U-58 and U-76)
  # hold on a 1 MiB thread at every optimization level: the depth tests at opt-level 0, where
  # the frames are largest. Nightly only: the test profile (opt-level 1) runs them on every PR.
  stack-windows:
    name: Depth limits at opt-level 0 (Windows)
    if: github.event_name == 'workflow_dispatch' && !inputs.targeted
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stack-opt0
      - name: Oracle environment
        run: cargo xtask oracle info
      # bash, so that the first command's failure fails the step (under pwsh only the last
      # command's exit code counts).
      - name: Depth tests at opt-level 0
        shell: bash
        run: |
          set -e
          cargo test -p ocio --test config_processors_oracle -- 1_mib_thread groups_count_in
          cargo test -p ocio --lib -- chains_of_references_stop_at_the_limit deep_groups_fit_a_small_stack the_nesting_weight_limit_is_exact

  stack-rocky9:
    name: Depth limits at opt-level 0 (Rocky Linux 9)
    if: github.event_name == 'workflow_dispatch' && !inputs.targeted
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Build the reference image
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Depth tests at opt-level 0
        run: |
          scripts/rocky9.sh bash -ec '
            export CARGO_PROFILE_DEV_OPT_LEVEL=0
            cargo xtask oracle info
            cargo test -p ocio --test config_processors_oracle -- 1_mib_thread groups_count_in
            cargo test -p ocio --lib -- chains_of_references_stop_at_the_limit deep_groups_fit_a_small_stack the_nesting_weight_limit_is_exact
          '

  targeted-controls:
    name: Targeted SDE execution controls
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Thread-limit, timeout and exact-selection controls (native)
        run: |
          python3 scripts/diagnostics/p64_targeted_controls.py
          python3 scripts/diagnostics/p50_schedule_controls.py
          python3 scripts/diagnostics/p46_join_order_controls.py

      - name: Full matrix waits for completed library work
        if: ${{ !inputs.targeted }}
        run: python3 scripts/sde_release_ready.py

  targeted-windows:
    name: Targeted ${{ matrix.plan }} ${{ matrix.cpu }} (Windows)
    if: github.event_name == 'workflow_dispatch' && inputs.targeted && inputs.targeted_scope == 'all'
    needs: targeted-controls
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - plan: boundary
            cpu: nhm
          - plan: boundary
            cpu: snb
          - plan: python313
            cpu: snb
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sde
      - name: Intel SDE archive
        uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-windows
      - name: Native oracle setup and source-keyed wheel client
        shell: bash
        run: |
          cargo xtask oracle info
          python scripts/sde_native_warmup.py
      - name: Exact original requests in fresh emulators
        shell: bash
        run: scripts/sde.sh ${{ matrix.cpu }} python scripts/sde_targeted.py --plan ${{ matrix.plan }} --cpu ${{ matrix.cpu }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-${{ matrix.plan }}-${{ matrix.cpu }}-Windows
          path: kept/sde-targeted/
          retention-days: 30

  targeted-rocky-icc:
    name: Targeted ${{ matrix.plan }} snb (Rocky Linux 9)
    if: github.event_name == 'workflow_dispatch' && inputs.targeted
    needs: targeted-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        plan: [icc-generated, icc-corrupt]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Intel SDE archive
        uses: actions/cache@v4
        with:
          path: target/sde-archives
          key: sde-10.13.1-2026-07-28-linux
      - name: Build the reference image
        run: docker build -t ocio-rs-rocky9:1 docker/rocky9
      - name: Allow SDE to trace processes
        run: sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Full unchanged ICC sweep, including bytes after31
        run: |
          scripts/rocky9.sh bash -ec '
            export OCIO_RS_TIER=full
            cargo xtask oracle info
            scripts/sde.sh snb python3 scripts/sde_targeted.py --plan ${{ matrix.plan }} --cpu snb
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-${{ matrix.plan }}-snb-Rocky
          path: kept/sde-targeted/
          retention-days: 30
