[project]
name = "wheel-inspect"
version = "0.1.0"
description = "Reads the machine code of the pinned opencolorio==2.5.2 wheel"
requires-python = "==3.13.*"
dependencies = [
    # The disassembler. Its text is the tool's output, so it is pinned exactly, like
    # everything here (uv.lock adds the hashes).
    "capstone==5.0.9",
    # Itanium C++ demangling for the Linux library's symbols (the Rust cpp_demangle crate).
    "cpp-demangle==0.1.3",
    # ELF sections, symbols, symbol versions and relocations.
    "pyelftools==0.33",
]

[project.scripts]
wheel-inspect = "wheel_inspect.cli:main"

[build-system]
requires = ["uv_build==0.11.7"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
