[[waiver]]
id = "W0001"
scope = "Windows only: the PQ fixed functions (LIN_TO_PQ, PQ_TO_LIN) on OCIO's exact-math path (fast math off), FixedFunctionOpCPU.cpp:2133-2194 and 2565-2590 @ v2.5.2. That includes OCIO's internal LUT bakes of PQ ops through Op::apply / EvalTransform (ops/OpTools.cpp). Linux is not waived: its wheel uses powf, and the port is bit-exact there"
check = "Bit-exact pixel comparison with the Windows wheel. There, with fast math off, NaN positions must still match exactly (a NaN's sign and payload bits may differ), infinities and every other value compare bit for bit, and a finite value may differ from the wheel's by at most bound_ulp below for the renderer: LIN_TO_PQ (FIXED_FUNCTION_LIN_TO_PQ forward) and PQ_TO_LIN (its inverse). Enforced by ocio_testkit::compare::pixels_report_within_ulp, through ocio_testkit::battery::params::Case::compare_pixels only, for the cases a family marks with Case::w0001 (crates/ocio-ops/tests/fixed_function_oracle.rs), whose callers a test pins; it reads bound_ulp from this entry. Fast math, and Linux, stay bit-exact. The LUT bakes of PQ ops aren't compared yet: the format sweep through the API doesn't run PQ"
reason = "The Windows wheel is built with MSVC, which compiles _mm_pow_ps to SVML's __vdecl_powf4. The port calls powf (the UCRT's) instead, which stable Rust calls directly and which doesn't depend on the MSVC toolset version. Measured on the full tier's probes (3,798,918 values per direction), natively and under SDE on nhm, snb, hsw, skl and skx, with the same results on all six: LIN_TO_PQ differs in 69,378 values (60,195 finite, 9,183 NaNs in their bits only), by at most 312 ulp, at input -5.29e26 (wheel -1.991878, port -1.9919152), not near black as spike S5 (docs/spikes/s2-s5.md) found on fewer values; PQ_TO_LIN differs in 1,623,495 values (27,462 finite, 1,596,033 NaNs in their bits only), by at most 568,267 ulp, at input 1.989, near the curve's pole, where the values are around 9e18 (wheel 9.1388845e18, port 8.8264764e18). No NaN position and no infinity differs. OCIO's own Linux build uses powf here, so OCIO already differs this much between platforms"
bound_ulp = { LIN_TO_PQ = 312, PQ_TO_LIN = 568267 }
bound_measured = "2026-10-05, chunk 2.3d2 (card p2-ff-cpu-2), over the full tier's probes; the exhaustive tier's every f32 isn't measured. Pending owner review"
approved_by = "Jose Enriquez (owner), in chat"
date = "2026-09-29"

[[waiver]]
id = "W0002"
scope = "Every op, both platforms: the color channel that a NaN transform parameter applies to. OCIO 2.5.2 accepts NaN parameters, for example YAML `.nan`, and such a parameter makes that channel NaN for every pixel, ordinary ones included. Extended 2026-10-04 (owner decision): from such a parameter also the NaN entries of the 1D LUT the optimizer bakes from the ops for integer and half inputs (the separable-prefix bake, which renders the ops without fast math), in that channel, and the CPU processor's cache ID, which hashes that LUT"
check = "Bit-exact comparison of NaN outputs in that channel. The port must return NaN exactly where the wheel returns NaN, but the NaN's sign and payload bits may differ. Everything else stays exact: other channels, finite values, and NaN bits in channels whose parameters are ordinary. For a baked 1D LUT (extended 2026-10-04): its entries compare the same way, read back from both optimized processors (createGroupTransform, the Lut1DTransform's values), and the CPU processor's cache ID may differ only in the hashes of such LUTs (each a 32-hex-digit hash after <Lut1D, compared per LUT): LUT k's hash may differ only where LUT k's entries differ in such NaN bits, and a LUT whose hash is equal must be bit-identical; refusals, getters, other values and other cache IDs stay exact. Enforced by ocio_testkit::compare::pixels_report_except_nan_bits, through ocio_testkit::battery::params::Case::compare_pixels and Case::compare_baked_luts only, whose callers a test pins (the battery's engine and crates/ocio/tests/api_formats_oracle.rs)"
reason = "Which NaN comes out depends on the operand order MSVC and GCC chose for each expression, and the two compilers differ; the S2 review found 2-5 of 32 NaN-parameter cases where the port's bits differ from a wheel. Matching exactly would mean reading every such expression out of both wheels' machine code. There is no visible difference (NaN in, NaN out), and only a config with NaN parameters can reach it. The port pins upstream's source operand order, so debug and release builds agree"
approved_by = "Jose Enriquez (owner), in chat; scope extended 2026-10-04 (owner decision on the p1-api-parity verifier's finding F1)"
date = "2026-09-29"
