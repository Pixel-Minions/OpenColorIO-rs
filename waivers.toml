[[waiver]]
id = "W0001"
scope = "Windows only: the PQ fixed functions (LIN_TO_PQ, PQ_TO_LIN) on OCIO's exact-math path (fast math off), FixedFunctionOpCPU.cpp:2133-2194 and 2565-2590 @ v2.5.2, split by input range (owner decision, 2026-10-05): (1) LIN_TO_PQ at every input, and PQ_TO_LIN at inputs up to 1 in magnitude (and NaN inputs), within a bound; (2) PQ_TO_LIN at inputs above 1 in magnitude, infinities included (beyond 10000 nits, through the curve's pole near 1.992), any difference. Both signs alike: the renderers mirror around 0. That includes OCIO's internal LUT bakes of PQ ops through Op::apply / EvalTransform (ops/OpTools.cpp), which no test compares. Linux is not waived: its wheel uses powf, and the port is bit-exact there; neither is fast math"
check = "Bit-exact pixel comparison with the Windows wheel, in R, G and B; alpha, which the PQ renderers pass through, stays bit-exact. With fast math off: (1) for LIN_TO_PQ (FIXED_FUNCTION_LIN_TO_PQ forward) at every input, and for PQ_TO_LIN (its inverse) at inputs with |x| <= 1 or NaN, NaN positions must match exactly (a NaN's sign and payload bits may differ), infinities and every other value compare bit for bit, and a finite value may differ from the wheel's by at most bound_ulp below for the renderer; (2) for PQ_TO_LIN at inputs with |x| > 1, any difference is allowed, NaN positions and infinities included. Enforced by ocio_testkit::compare::pixels_report_within_ulp, through ocio_testkit::battery::params::Case::compare_pixels only, for the cases marked with Case::w0001 (the PQ cases of crates/ocio-ops/tests/fixed_function_oracle.rs and crates/ocio/tests/common/api_cases.rs), whose callers a test pins; it reads bound_ulp from this entry, and range (2) is ocio_testkit::battery::params::W0001Function::unbounded. The format sweep through the API (crates/ocio/tests/api_formats_oracle.rs) runs the PQ case on Windows without fast math only from F32 to F32, where nothing is baked or rounded, and counts the other applies as not run. Around the pole, fixed_function_oracle.rs's pq_to_lin_pole_window_is_pinned checks every f32 with 1.93 <= |x| <= 2.07: NaNs and infinities at different inputs only with 1.95 <= |x| <= 2.05. Fast math, and Linux, stay bit-exact"
reason = "The Windows wheel is built with MSVC, which compiles _mm_pow_ps to SVML's __vdecl_powf4. The port calls powf (the UCRT's) instead, which stable Rust calls directly and which doesn't depend on the MSVC toolset version. Measured over every f32 (4,294,967,296 inputs per direction) natively, both signs giving the same numbers: LIN_TO_PQ differs in 75,144,610 values (16,777,212 NaNs in their bits only), by at most 339 ulp, at +/-4.305388e-6 (wheel 3.9050283e-3, port 3.9049494e-3), never in a NaN position or an infinity. PQ_TO_LIN at |x| <= 1 and NaN inputs differs in 26,219,560 values (16,777,210 NaNs in their bits only), by at most 3,356,700 ulp, at +/-7.3106054e-7, just above PQ's code for 0 (7.36e-7), where x^(1/m2) - c1 cancels and the output is subnormal (wheel 2.1552811e-38, port 1.6849073e-38); 101,008 values differ by more than 1,000 ulp, at |x| from 7.3098244e-7 to 0.9528933 (there wheel 63.997776, port 63.99325); no NaN position or infinity differs. Above 1 in magnitude, PQ_TO_LIN differs by about 2,200 ulp just above 1, growing to about 73,000 at 1.95 and 53,201,745 at 1.9920357, near the pole (wheel 1.3134595e33, port 1.6932873e31); it differs in kind at 1.9920543 (wheel inf, port 1.3134595e33) and 1.9920729 (wheel NaN, port inf), and beyond the pole both give NaNs, in different bits. The spike S5 (docs/spikes/s2-s5.md) and the first bound (2.3d2: 312 and 568,267 ulp, over the full tier's probes) saw fewer values; a verifier's dense sweep found PQ_TO_LIN beyond it near the pole. OCIO's own Linux build uses powf here, so OCIO already differs this much between platforms"
bound_ulp = { LIN_TO_PQ = 339, PQ_TO_LIN = 3356700 }
bound_measured = "2026-10-05, chunk 2.3d3 (card p2-ff-cpu-2), on every f32 natively, LIN_TO_PQ at every input and PQ_TO_LIN at |x| <= 1 and NaN inputs; under SDE on nhm, snb, hsw, skl and skx on every 61st f32 and the native maxima, with the same results. The bounds are the measured maxima, written as the owner decided in chat on 2026-10-05"
approved_by = "Jose Enriquez (owner), in chat; scope split by range approved by the owner in chat on 2026-10-05"
date = "2026-09-29"

[[waiver]]
id = "W0002"
scope = "Every op, both platforms: the color channel that a NaN transform parameter applies to. OCIO 2.5.2 accepts NaN parameters, for example YAML `.nan`, and such a parameter makes that channel NaN for every pixel, ordinary ones included. Extended 2026-10-04 (owner decision): from such a parameter also the NaN entries of the 1D LUT the optimizer bakes from the ops for integer and half inputs (the separable-prefix bake, which renders the ops without fast math), in that channel, and the CPU processor's cache ID, which hashes that LUT"
check = "Bit-exact comparison of NaN outputs in that channel. The port must return NaN exactly where the wheel returns NaN, but the NaN's sign and payload bits may differ. Everything else stays exact: other channels, finite values, and NaN bits in channels whose parameters are ordinary. For a baked 1D LUT (extended 2026-10-04): its entries compare the same way, read back from both optimized processors (createGroupTransform, the Lut1DTransform's values), and the CPU processor's cache ID may differ only in the hashes of such LUTs (each a 32-hex-digit hash after <Lut1D, compared per LUT): LUT k's hash may differ only where LUT k's entries differ in such NaN bits, and a LUT whose hash is equal must be bit-identical; refusals, getters, other values and other cache IDs stay exact. Enforced by ocio_testkit::compare::pixels_report_except_nan_bits, through ocio_testkit::battery::params::Case::compare_pixels and Case::compare_baked_luts only, whose callers a test pins (the battery's engine and crates/ocio/tests/api_formats_oracle.rs)"
reason = "Which NaN comes out depends on the operand order MSVC and GCC chose for each expression, and the two compilers differ; the S2 review found 2-5 of 32 NaN-parameter cases where the port's bits differ from a wheel. Matching exactly would mean reading every such expression out of both wheels' machine code. There is no visible difference (NaN in, NaN out), and only a config with NaN parameters can reach it. The port pins upstream's source operand order, so debug and release builds agree"
approved_by = "Jose Enriquez (owner), in chat; scope extended 2026-10-04 (owner decision on the p1-api-parity verifier's finding F1)"
date = "2026-09-29"
