id = "W0013"
scope = "Linux OCIO2.5.2 GLSL1.20 on the validated Mesa llvmpipe renderer; non-finite image sampling footprints only; all test families, no test-specific lists"
check = "Full port/wheel GPU bits and shader/resource/uniform/cache identity remain exact. Original upstream thresholds and exceptional-value checks remain enforced on every finite image-filter footprint. A complete uncached live-wheel finite companion must pass without exceptions. Independent native-vs-Rust complete readback and platform controls are mandatory. All original comparisons and class exceptions are recorded. No per-test GPU tuple rules remain active; historical Matrix metadata is archived."
reason = "Minimal independent EGL/GL probes prove NaN/Inf texel filtering and Inf*0 matrix behavior. CI40892696031 measured520 native observations; all519 recorded Suite1/Matrix mismatches have non-finite sampling dependencies. The owner explicitly approved the stricter finite-footprint variant with native/Rust regression and rejection controls in the same chunk; evidence must be outside target, diagnostic ci.yml must stay out of main, and W0003-W0012 retire only after both CI profiles pass. See docs/gpu-nonfinite.md."
approved_by = "Project owner, explicit chat approval of the stricter three-check rule and four implementation conditions, 2026-10-29"
date = "2026-10-29"
